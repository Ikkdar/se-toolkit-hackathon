services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REGISTRY_PREFIX_DOCKER_HUB: ${REGISTRY_PREFIX_DOCKER_HUB:-}
    container_name: exampulse-backend
    env_file:
      - ./backend/.env.example
    environment:
      - DATABASE_URL=sqlite:///./data/exampulse.db
      - LLM_PROVIDER=auto
      - LLM_TIMEOUT_SECONDS=40
      - QWEN_PROXY_BASE_URL=http://qwen-proxy:8080/v1
      - QWEN_PROXY_API_KEY=fake-key
      - QWEN_PROXY_MODEL=coder-model
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
    volumes:
      - backend_data:/app/data
    ports:
      - ${BACKEND_HOST_ADDRESS:-0.0.0.0}:${BACKEND_HOST_PORT:-8000}:8000
    depends_on:
      - qwen-proxy
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REGISTRY_PREFIX_DOCKER_HUB: ${REGISTRY_PREFIX_DOCKER_HUB:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        VITE_API_BASE_URL: ${FRONTEND_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: exampulse-frontend
    depends_on:
      - backend
    ports:
      - ${FRONTEND_HOST_ADDRESS:-0.0.0.0}:${FRONTEND_HOST_PORT:-5173}:80

  ollama:
    image: ${REGISTRY_PREFIX_DOCKER_HUB:-}ollama/ollama:latest
    container_name: exampulse-ollama
    ports:
      - ${OLLAMA_HOST_ADDRESS:-0.0.0.0}:${OLLAMA_HOST_PORT:-11434}:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  qwen-proxy:
    build:
      context: ./qwen-proxy
      dockerfile: Dockerfile
      args:
        REGISTRY_PREFIX_DOCKER_HUB: ${REGISTRY_PREFIX_DOCKER_HUB:-}
    container_name: exampulse-qwen-proxy
    environment:
      - ADDRESS=0.0.0.0
      - PORT=8080
      - MAX_RETRIES=5
      - RETRY_DELAY_MS=1000
      - LOG_REQUESTS=false
      - QWEN_CODE_AUTH_USE=true
      - QWEN_CODE_API_KEY=fake-key
      - DEFAULT_MODEL=coder-model
      - LOG_LEVEL=error
    volumes:
      - ${QWEN_CREDS_HOST_PATH:-${HOME}/.qwen}:/root/.qwen
    ports:
      - ${QWEN_PROXY_HOST_ADDRESS:-0.0.0.0}:${QWEN_PROXY_HOST_PORT:-8080}:8080
    restart: unless-stopped

volumes:
  backend_data:
  ollama_data:
